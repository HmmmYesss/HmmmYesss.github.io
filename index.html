<!DOCTYPE html>
<html>
<head>
<style>
* {
  box-sizing: border-box;
}

.column {
  float: left;
  width: 33.33%;
  padding: 5px;
}

/* Clearfix (clear floats) */
.row::after {
  content: "";
  clear: both;
  display: table;
}

.img:hover {
  background-color: RoyalBlue;
}
  
</style>
</head>
<body>
  
<div class="row">
  <div class="column">
    <img src="Pictures/Walk_a_Mile_in_a_Chuds_Shoe.jpg" alt="Chud" style="width:100%">
  </div>
  <div class="column">
    <img src="Pictures/Invisible_Horse_plane.jpg" alt="Horse" style="width:100%">
  </div>
  <div class="column">
    <img src="Pictures/Neutron_Star_to_the_Dome.jpg" alt="Star" style="width:100%">
  </div>
</div>


<div class="row">
 <div class="column">

</body>
</html>
